          var body = ui.panel ? panels[ui.panel.type](ui.panel) : views[ui.tab]();
          var banner = ui.banner ? '<div class="x-banner" role="note"><span>Changes won\'t be saved in this preview. Use Export to back up.</span><button data-act="hideBanner" aria-label="Dismiss">×</button></div>' : "";
          document.getElementById("app").innerHTML = header() + '<main class="x-main">' + banner + body + "</main>" + tabs();
          var sel = document.querySelector('.x-day[aria-pressed="true"]');
          if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest", inline: "center" });
        }

        document.addEventListener("keydown", function (e) {
          var el = e.target;
          if ((e.key === "Enter" || e.key === " ") && el.getAttribute && el.getAttribute("role") === "checkbox" && el.dataset.act) { e.preventDefault(); el.click(); }
        });

        window.PS = { S: S, ui: ui, save: save, render: render, actions: actions, views: views, panels: panels, newId: newId, toast: toast };
        if (SYNC.space) render(); else showLock();
      })();
    </script>
